name: Windows demo build

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows x64 demo
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and upload development package
        uses: ./.github/actions/package-windows
