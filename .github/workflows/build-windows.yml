name: Windows demo build

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows x64 demo
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build and upload development package
        uses: ./.github/actions/package-windows
